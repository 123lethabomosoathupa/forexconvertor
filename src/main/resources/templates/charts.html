<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Forex — Charts</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/theme.css}"/>
  <style>
    body { padding: 30px 20px; }
    .page-charts { max-width: 900px; margin: 0 auto; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 26px; }
    .top-bar h1 { font-size: 24px; font-weight: 700; }
  </style>
</head>
<body>
  <div class="page-charts">
    <div class="top-bar">
      <h1>Rate History</h1>
      <a href="/converter" class="btn btn-outline">Converter</a>
    </div>

    <div class="selector-card">
      <div class="field">
        <label>From</label>
        <select id="fromSelect">
          <option th:each="c : ${currencies}" th:value="${c}" th:text="${c}"></option>
        </select>
      </div>
      <div class="field">
        <label>To</label>
        <select id="toSelect">
          <option th:each="c : ${currencies}" th:value="${c}" th:text="${c}"
                  th:selected="${c == 'ZAR'}"></option>
        </select>
      </div>
      <button class="btn" onclick="loadChart()">Load Chart</button>
    </div>

    <div class="chart-card">
      <p class="chart-title" id="chartTitle">Select a pair and click Load Chart</p>
      <div id="emptyState" class="empty">No data yet — make some conversions first</div>
      <canvas id="rateChart" style="display:none;"></canvas>
    </div>
  </div>

  <script>
    let chart = null;

    async function loadChart() {
      const from = document.getElementById('fromSelect').value;
      const to   = document.getElementById('toSelect').value;

      document.getElementById('emptyState').style.display = 'none';
      document.getElementById('rateChart').style.display  = 'none';
      document.getElementById('chartTitle').innerHTML =
        'Loading <span>' + from + '/' + to + '</span>...';

      const res  = await fetch('/charts/data?from=' + from + '&to=' + to);
      const data = await res.json();

      if (!data.labels || data.labels.length === 0) {
        document.getElementById('emptyState').style.display = 'block';
        document.getElementById('emptyState').textContent =
          'No conversions for ' + from + '/' + to + ' yet.';
        document.getElementById('chartTitle').textContent = from + '/' + to;
        return;
      }

      document.getElementById('chartTitle').innerHTML =
        '<span>' + from + '/' + to + '</span> — Last ' + data.labels.length + ' conversions';
      document.getElementById('rateChart').style.display = 'block';

      if (chart) chart.destroy();

      chart = new Chart(document.getElementById('rateChart').getContext('2d'), {
        type: 'line',
        data: {
          labels: data.labels,
          datasets: [{
            label: '1 ' + from + ' = ? ' + to,
            data: data.rates,
            borderColor: '#4B2E83',
            backgroundColor: 'rgba(75,46,131,0.08)',
            borderWidth: 2,
            pointRadius: 3,
            pointBackgroundColor: '#FF6B35',
            tension: 0.3,
            fill: true
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: { labels: { color: '#635F72' } },
            tooltip: { callbacks: { label: c => '  Rate: ' + c.parsed.y.toFixed(4) } }
          },
          scales: {
            x: { ticks: { color: '#9C97AC', maxTicksLimit: 10 },
                 grid:  { color: 'rgba(75,46,131,0.08)' } },
            y: { ticks: { color: '#9C97AC' },
                 grid:  { color: 'rgba(75,46,131,0.08)' } }
          }
        }
      });
    }
  </script>
</body>
</html>
