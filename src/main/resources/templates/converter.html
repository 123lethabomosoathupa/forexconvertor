<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Convert — Forex App</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f5f5f5; color: #111; }
    nav { background: #111; color: #fff; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; }
    nav a { color: #ccc; text-decoration: none; margin-left: 20px; font-size: 14px; }
    nav a:hover { color: #fff; }
    .brand { font-weight: 600; font-size: 16px; color: #fff; }
    main { max-width: 520px; margin: 40px auto; padding: 0 16px; }
    h1 { font-size: 22px; font-weight: 600; margin-bottom: 24px; }
    .card { background: #fff; border-radius: 12px; padding: 32px; box-shadow: 0 1px 8px rgba(0,0,0,.07); }
    label { display: block; font-size: 13px; color: #555; margin-bottom: 4px; margin-top: 16px; }
    input, select { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; background: #fff; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    button { width: 100%; margin-top: 24px; padding: 12px; background: #111; color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; }
    button:hover { background: #333; }
    .live-rate { font-size: 12px; color: #777; margin-top: 6px; min-height: 16px; }
    .live-rate span { color: #059669; font-weight: 500; }
    .result { margin-top: 24px; padding: 20px; background: #f0fdf4; border-radius: 10px; }
    .result-main { font-size: 22px; font-weight: 600; }
    .result-sub { font-size: 13px; color: #555; margin-top: 4px; }
    .back { display: inline-block; margin-top: 20px; font-size: 13px; color: #777; text-decoration: none; }
    .back:hover { color: #111; }
  </style>
</head>
<body>

<nav>
  <span class="brand">Forex App</span>
  <div>
    <a th:href="@{/dashboard}">Dashboard</a>
    <a th:href="@{/history}">History</a>
    <a th:href="@{/logout}">Logout</a>
  </div>
</nav>

<main>
  <h1>Currency Converter</h1>
  <div class="card">
    <form th:action="@{/converter}" method="post">
      <div class="row">
        <div>
          <label for="fromCurrency">From</label>
          <select id="fromCurrency" name="fromCurrency" onchange="fetchRate()">
            <option>USD</option><option>EUR</option><option>GBP</option>
            <option>ZAR</option><option>JPY</option><option>AUD</option>
            <option>CAD</option><option>CHF</option><option>CNY</option>
            <option>NGN</option><option>INR</option>
          </select>
        </div>
        <div>
          <label for="toCurrency">To</label>
          <select id="toCurrency" name="toCurrency" onchange="fetchRate()">
            <option>ZAR</option><option>USD</option><option>EUR</option>
            <option>GBP</option><option>JPY</option><option>AUD</option>
            <option>CAD</option><option>CHF</option><option>CNY</option>
            <option>NGN</option><option>INR</option>
          </select>
        </div>
      </div>

      <label for="amount">Amount</label>
      <input id="amount" name="amount" type="number" step="0.01" min="0.01" placeholder="1000.00" required/>

      <label for="exchangeRate">Exchange Rate</label>
      <input id="exchangeRate" name="exchangeRate" type="number" step="0.000001" min="0.000001" placeholder="Loading..." required/>
      <div class="live-rate" id="live-rate-label">Fetching live rate...</div>

      <label for="notes">Notes (optional)</label>
      <input id="notes" name="notes" type="text" placeholder="e.g. Client payment"/>

      <button type="submit">Convert &amp; Save</button>
    </form>

    <div th:if="${result}" class="result">
      <div class="result-main">
        <span th:text="${#numbers.formatDecimal(result.sourceAmount(), 0, 2)}"></span>
        <span th:text="${result.fromCurrency()}"></span>
        =
        <span th:text="${#numbers.formatDecimal(result.convertedAmount(), 0, 4)}"></span>
        <span th:text="${result.toCurrency()}"></span>
      </div>
      <div class="result-sub">
        Rate: 1 <span th:text="${result.fromCurrency()}"></span>
        = <span th:text="${#numbers.formatDecimal(result.exchangeRate(), 1, 6)}"></span>
        <span th:text="${result.toCurrency()}"></span>
        &nbsp;·&nbsp; Saved to history ✓
      </div>
    </div>
  </div>

  <a th:href="@{/dashboard}" class="back">← Back to dashboard</a>
</main>

<script>
  async function fetchRate() {
    const from  = document.getElementById('fromCurrency').value;
    const to    = document.getElementById('toCurrency').value;
    const input = document.getElementById('exchangeRate');
    const label = document.getElementById('live-rate-label');

    if (from === to) {
      input.value = '1';
      label.innerHTML = 'Same currency — rate is 1';
      return;
    }

    label.textContent = 'Fetching live rate...';
    try {
      const res  = await fetch(`/api/v1/rates/convert?from=${from}&to=${to}`);
      const data = await res.json();
      if (data.rate) {
        input.value = parseFloat(data.rate).toFixed(6);
        label.innerHTML = `Live: 1 ${from} = <span>${parseFloat(data.rate).toFixed(4)} ${to}</span>`;
      } else {
        label.textContent = 'Rate unavailable — enter manually';
      }
    } catch(e) {
      label.textContent = 'Could not fetch rate — enter manually';
    }
  }

  // Fetch rate on page load
  fetchRate();
</script>

</body>
</html>
