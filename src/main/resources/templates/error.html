<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Error — Forex App</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f5f5f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .card { background: #fff; border-radius: 12px; padding: 48px 40px; max-width: 420px; text-align: center; box-shadow: 0 2px 16px rgba(0,0,0,.08); }
    .code { font-size: 64px; font-weight: 700; color: #e5e7eb; line-height: 1; margin-bottom: 16px; }
    h1 { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
    p { font-size: 14px; color: #777; margin-bottom: 24px; }
    a { display: inline-block; padding: 10px 20px; background: #111; color: #fff; text-decoration: none; border-radius: 8px; font-size: 13px; font-weight: 500; }
    a:hover { background: #333; }
  </style>
</head>
<body>
<div class="card">
  <div class="code" th:text="${status}">Error</div>
  <h1 th:text="${error}">Something went wrong</h1>
  <p th:text="${message != null ? message : 'An unexpected error occurred. Please try again.'}"></p>
  <a href="/dashboard">Back to Dashboard</a>
</div>
</body>
</html>
