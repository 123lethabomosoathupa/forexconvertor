<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Error — Forex App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/theme.css}"/>
</head>
<body>
<div class="error-shell">
  <div class="error-card">
    <div class="error-code" th:text="${status}">Error</div>
    <h1 th:text="${error}">Something went wrong</h1>
    <p th:text="${message != null ? message : 'An unexpected error occurred. Please try again.'}"></p>
    <a href="/dashboard" class="btn">Back to dashboard</a>
  </div>
</div>
</body>
</html>
