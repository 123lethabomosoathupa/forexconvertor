<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Alerts — Forex App</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f5f5f5; color: #111; }
    nav { background: #111; color: #fff; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; }
    nav a { color: #ccc; text-decoration: none; margin-left: 20px; font-size: 14px; }
    nav a:hover { color: #fff; }
    .brand { font-weight: 600; font-size: 16px; color: #fff; }
    main { max-width: 960px; margin: 32px auto; padding: 0 16px; }
    h1 { font-size: 22px; font-weight: 600; margin-bottom: 8px; }
    .subtitle { font-size: 14px; color: #777; margin-bottom: 24px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .card { background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 1px 8px rgba(0,0,0,.07); }
    .card h2 { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
    label { display: block; font-size: 13px; color: #555; margin-bottom: 4px; margin-top: 14px; }
    input, select { width: 100%; padding: 9px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
    button { width: 100%; margin-top: 20px; padding: 11px; background: #111; color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; }
    button:hover { background: #333; }
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; padding: 10px 12px; font-size: 12px; text-transform: uppercase; color: #777; letter-spacing: .04em; border-bottom: 1px solid #f0f0f0; }
    td { padding: 10px 12px; border-bottom: 1px solid #f0f0f0; font-size: 14px; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 11px; font-weight: 500; }
    .active  { background: #dcfce7; color: #166534; }
    .triggered { background: #fef9c3; color: #854d0e; }
    .empty { text-align: center; color: #999; padding: 24px; font-size: 14px; }
  </style>
</head>
<body>

<nav>
  <span class="brand">Forex App</span>
  <div>
    <a th:href="@{/dashboard}">Dashboard</a>
    <a th:href="@{/converter}">Convert</a>
    <a th:href="@{/history}">History</a>
    <a th:href="@{/logout}">Logout</a>
  </div>
</nav>

<main>
  <h1>Rate Alerts</h1>
  <p class="subtitle">Get notified when a currency pair hits your target rate.</p>

  <div class="grid">

    <!-- Create alert form -->
    <div class="card">
      <h2>New Alert</h2>
      <form th:action="@{/alerts}" method="post">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
          <div>
            <label>From</label>
            <select name="fromCurrency">
              <option>USD</option><option>EUR</option><option>GBP</option>
              <option>ZAR</option><option>JPY</option><option>AUD</option>
              <option>CAD</option><option>CHF</option><option>CNY</option>
            </select>
          </div>
          <div>
            <label>To</label>
            <select name="toCurrency">
              <option>ZAR</option><option>USD</option><option>EUR</option>
              <option>GBP</option><option>JPY</option><option>AUD</option>
              <option>CAD</option><option>CHF</option><option>CNY</option>
            </select>
          </div>
        </div>

        <label>Target Rate</label>
        <input name="targetRate" type="number" step="0.0001" min="0.0001" placeholder="19.00" required/>

        <label>Direction</label>
        <select name="direction">
          <option value="ABOVE">Alert when rate goes ABOVE target</option>
          <option value="BELOW">Alert when rate goes BELOW target</option>
        </select>

        <button type="submit">Create Alert</button>
      </form>
    </div>

    <!-- Existing alerts -->
    <div class="card">
      <h2>Your Alerts</h2>
      <table th:if="${not #lists.isEmpty(alerts)}">
        <thead>
          <tr><th>Pair</th><th>Target</th><th>Direction</th><th>Status</th></tr>
        </thead>
        <tbody>
          <tr th:each="a : ${alerts}">
            <td th:text="${a.fromCurrency + '/' + a.toCurrency}"></td>
            <td th:text="${a.targetRate}"></td>
            <td th:text="${a.direction}"></td>
            <td>
              <span class="badge" th:classappend="${a.triggered ? 'triggered' : 'active'}"
                    th:text="${a.triggered ? 'Triggered' : 'Active'}"></span>
            </td>
          </tr>
        </tbody>
      </table>
      <p class="empty" th:if="${#lists.isEmpty(alerts)}">No alerts yet.</p>
    </div>

  </div>
</main>

</body>
</html>
