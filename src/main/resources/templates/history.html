<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>History — Forex App</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f5f5f5; color: #111; }
    nav { background: #111; color: #fff; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; }
    nav a { color: #ccc; text-decoration: none; margin-left: 20px; font-size: 14px; }
    nav a:hover { color: #fff; }
    .brand { font-weight: 600; font-size: 16px; color: #fff; }
    main { max-width: 960px; margin: 32px auto; padding: 0 16px; }
    h1 { font-size: 22px; font-weight: 600; margin-bottom: 24px; }
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 6px rgba(0,0,0,.06); }
    th { background: #f8f8f8; text-align: left; padding: 12px 16px; font-size: 12px; text-transform: uppercase; color: #777; letter-spacing: .04em; }
    td { padding: 12px 16px; border-top: 1px solid #f0f0f0; font-size: 14px; }
    .pagination { margin-top: 20px; display: flex; gap: 8px; }
    .pagination a { padding: 8px 14px; background: #fff; border: 1px solid #ddd; border-radius: 6px; text-decoration: none; font-size: 13px; color: #111; }
    .pagination a:hover { background: #f5f5f5; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 11px; font-weight: 500; background: #dcfce7; color: #166534; }
  </style>
</head>
<body>

<nav>
  <span class="brand">Forex App</span>
  <div>
    <a th:href="@{/dashboard}">Dashboard</a>
    <a th:href="@{/converter}">Convert</a>
    <a th:href="@{/logout}">Logout</a>
  </div>
</nav>

<main>
  <h1>Transaction History</h1>

  <table>
    <thead>
      <tr>
        <th>Date</th>
        <th>From</th>
        <th>To</th>
        <th>Amount</th>
        <th>Converted</th>
        <th>Rate</th>
        <th>Status</th>
        <th>Notes</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="tx : ${history.content()}">
        <td th:text="${#temporals.format(tx.createdAt(), 'dd MMM yyyy HH:mm')}"></td>
        <td th:text="${tx.fromCurrency()}"></td>
        <td th:text="${tx.toCurrency()}"></td>
        <td th:text="${#numbers.formatDecimal(tx.sourceAmount(), 0, 2)}"></td>
        <td th:text="${#numbers.formatDecimal(tx.convertedAmount(), 0, 4)}"></td>
        <td th:text="${#numbers.formatDecimal(tx.exchangeRate(), 1, 6)}"></td>
        <td><span class="badge" th:text="${tx.status()}"></span></td>
        <td th:text="${tx.notes() != null ? tx.notes() : '—'}"></td>
      </tr>
      <tr th:if="${#lists.isEmpty(history.content())}">
        <td colspan="8" style="text-align:center;color:#999;padding:32px">No transactions yet.</td>
      </tr>
    </tbody>
  </table>

  <div class="pagination">
    <a th:if="${!history.first()}" th:href="@{/history(page=${history.page() - 1})}">← Previous</a>
    <a th:if="${!history.last()}"  th:href="@{/history(page=${history.page() + 1})}">Next →</a>
  </div>
</main>

</body>
</html>
