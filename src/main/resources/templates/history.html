<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>History — Forex App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/theme.css}"/>
</head>
<body>

<nav class="appnav">
  <span class="brand"><span class="dot"></span>Forex App</span>
  <div class="links">
    <a th:href="@{/dashboard}" class="navlink">Dashboard</a>
    <a th:href="@{/converter}" class="navlink">Convert</a>
    <a th:href="@{/history}" class="navlink current">History</a>
    <a th:href="@{/logout}" class="navlink">Logout</a>
  </div>
</nav>

<main class="page">
  <div class="page-head">
    <h1>Transaction History</h1>
    <p class="subtitle">Every conversion you've made, in order.</p>
  </div>

  <div class="table-card">
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>From</th>
          <th>To</th>
          <th>Amount</th>
          <th>Converted</th>
          <th>Rate</th>
          <th>Status</th>
          <th>Notes</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="tx : ${history.content()}">
          <td th:text="${#temporals.format(tx.createdAt(), 'dd MMM yyyy HH:mm')}"></td>
          <td th:text="${tx.fromCurrency()}"></td>
          <td th:text="${tx.toCurrency()}"></td>
          <td th:text="${#numbers.formatDecimal(tx.sourceAmount(), 0, 2)}"></td>
          <td th:text="${#numbers.formatDecimal(tx.convertedAmount(), 0, 4)}"></td>
          <td th:text="${#numbers.formatDecimal(tx.exchangeRate(), 1, 6)}"></td>
          <td><span class="badge positive" th:text="${tx.status()}"></span></td>
          <td th:text="${tx.notes() != null ? tx.notes() : '—'}"></td>
        </tr>
        <tr th:if="${#lists.isEmpty(history.content())}">
          <td colspan="8" class="empty">No transactions yet.</td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="pagination">
    <a th:if="${!history.first()}" th:href="@{/history(page=${history.page() - 1})}">← Previous</a>
    <a th:if="${!history.last()}"  th:href="@{/history(page=${history.page() + 1})}">Next →</a>
  </div>
</main>

</body>
</html>
