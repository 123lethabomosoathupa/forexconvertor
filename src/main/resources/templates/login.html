<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Login — Forex App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/theme.css}"/>
</head>
<body>
<div class="auth-shell">
  <div class="auth-card">
    <div class="mark"><span class="dot"></span><span>FOREX APP</span></div>
    <h1>Welcome back</h1>
    <p class="lede">Sign in to check rates and manage your conversions.</p>

    <div th:if="${errorMsg}"  class="msg error"   th:text="${errorMsg}"></div>
    <div th:if="${logoutMsg}" class="msg success" th:text="${logoutMsg}"></div>
    <div th:if="${param.registered}" class="msg success">Account created — sign in below.</div>

    <form th:action="@{/login}" method="post">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" required autofocus/>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" required/>

      <button type="submit" class="full">Sign in</button>
    </form>

    <p class="footer-line">No account? <a th:href="@{/register}">Register</a></p>
  </div>
</div>
</body>
</html>
