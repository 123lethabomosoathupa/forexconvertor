<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Register — Forex App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/theme.css}"/>
</head>
<body>
<div class="auth-shell">
  <div class="auth-card">
    <div class="mark"><span class="dot"></span><span>FOREX APP</span></div>
    <h1>Create your account</h1>
    <p class="lede">Track rates and conversions in one place.</p>

    <div th:if="${errorMsg}" class="msg error" th:text="${errorMsg}"></div>

    <form th:action="@{/register}" method="post">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" required autofocus/>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" required minlength="8"/>

      <button type="submit" class="full">Create account</button>
    </form>

    <p class="footer-line">Already have an account? <a th:href="@{/login}">Sign in</a></p>
  </div>
</div>
</body>
</html>
