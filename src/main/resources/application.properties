# ── Server ─────────────────────────────────────────────────────────────────────
server.port=${PORT:8082}

# ── MongoDB ────────────────────────────────────────────────────────────────────
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/forex_transactions}
# For Atlas: mongodb+srv://user:pass@cluster.mongodb.net/forex_transactions

# Auto-create indexes declared with @Indexed / @CompoundIndex on startup
spring.data.mongodb.auto-index-creation=true

# ── JWT (must match Auth Service secret exactly) ───────────────────────────────
app.jwt.secret=${JWT_SECRET}

# ── Swagger / OpenAPI ──────────────────────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ── Pagination ─────────────────────────────────────────────────────────────────
app.pagination.default-page-size=20
app.pagination.max-page-size=100

# ── Logging ────────────────────────────────────────────────────────────────────
logging.level.com.forex=DEBUG
logging.level.org.springframework.data.mongodb=INFO
