# ── Server ─────────────────────────────────────────────────────────────────────
# Render injects PORT at runtime; fall back to 8080 locally
server.port=${PORT:8080}

# ── MongoDB Atlas ──────────────────────────────────────────────────────────────
# Set SPRING_DATA_MONGODB_URI in Render environment variables
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/forex_transactions}
spring.data.mongodb.auto-index-creation=true

# ── JWT (for /api/v1/** endpoints) ────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

# ── Thymeleaf ──────────────────────────────────────────────────────────────────
spring.thymeleaf.cache=false

# ── Swagger ────────────────────────────────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ── Logging ────────────────────────────────────────────────────────────────────
logging.level.com.forex=DEBUG

# ── Actuator ───────────────────────────────────────────────────────────────────
# Only expose the health endpoint (used by Render health check)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ── Spring profiles ────────────────────────────────────────────────────────────
# Render sets SPRING_PROFILES_ACTIVE=prod via render.yaml
# Locally nothing is set, so dev defaults apply

# ── Error handling ─────────────────────────────────────────────────────────────
server.error.include-stacktrace=never
server.error.include-message=always
