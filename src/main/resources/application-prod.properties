# ── Production profile (active on Render via SPRING_PROFILES_ACTIVE=prod) ──────

# Disable Swagger UI in production — don't expose API docs publicly
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# Tighter logging in production
logging.level.com.forex=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.data.mongodb=WARN
logging.level.org.mongodb.driver=WARN

# Thymeleaf caching on in production
spring.thymeleaf.cache=true

# Don't show full error details to clients
server.error.include-stacktrace=never
server.error.include-message=never
